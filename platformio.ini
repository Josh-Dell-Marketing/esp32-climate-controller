; Climate controller: two ESP32 boards on a wired serial link. See PLAN.md.
;   mainboard   ESP32 NodeMCU WROOM-32 DevKit: sensor, relays, fan speed + tach, control rules
;   controller  ESP32-C3 SuperMini: OLED display + rotary encoders (user interface)
;
; Build both:      pio run
; Flash one:       pio run -e mainboard -t upload
;                  pio run -e controller -t upload
; Serial monitor:  pio device monitor -e mainboard   (or -e controller)
;
; With both boards plugged in, add --upload-port / --monitor-port (for example COM5
; on Windows, /dev/ttyUSB0 on Linux) so each env goes to the right board.

[platformio]
default_envs = mainboard, controller

[env]
platform = espressif32 @ ~6.9.0
framework = arduino
monitor_speed = 115200
build_flags = -Wall

; ESP32 NodeMCU WROOM-32 DevKit
[env:mainboard]
board = esp32dev
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_src_filter = +<mainboard/>
lib_deps =
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BMP280 Library @ ^2.6.8

; ESP32-C3 SuperMini. Uses the chip's own USB for flashing and Serial.
; If the board will not flash: hold BOOT, tap RESET, release BOOT, then upload.
[env:controller]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_src_filter = +<controller/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    olikraus/U8g2 @ ^2.35.30
