; Climate controller (fan, heater, humidifier, compressor) for ESP8266 (NodeMCU) or ESP32
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = nodemcuv2

; NodeMCU v2/v3 with an ESP-12E/12F module (ESP8266)
[env:nodemcuv2]
platform = espressif8266 @ ^4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
upload_speed = 460800

; NodeMCU plugged into the project's carrier PCB (hardware/): relays are
; active HIGH there. Same pins as above.
[env:nodemcuv2-pcb]
extends = env:nodemcuv2
build_flags = -DCLIMATE_PCB

; ESP32 DevKit (ESP32-WROOM-32)
[env:esp32dev]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; After the first USB upload you can flash the NodeMCU over WiFi:
;   pio run -e ota -t upload
[env:ota]
extends = env:nodemcuv2
upload_protocol = espota
upload_port = climate.local
; Must match OTA_PASSWORD in include/secrets.h
upload_flags = --auth=change-me
